{% extends "base.html" %}

{% block content %}

<style>
.profile-container {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 80vh;
}

.profile-card {
    background: rgba(255,255,255,0.08);
    padding: 25px;
    border-radius: 16px;
    backdrop-filter: blur(12px);
    text-align: center;
    width: 320px;
    box-shadow: 0 6px 25px rgba(0,0,0,0.3);
    border: 1px solid rgba(255,255,255,0.1);
}

.profile-img {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid #38bdf8;
    margin-bottom: 15px;
}

.profile-card h2 {
    color: #38bdf8;
    margin-bottom: 10px;
}

.profile-card p {
    color: #ddd;
    margin: 6px 0;
}

.logout-btn {
    display: inline-block;
    margin-top: 15px;
    padding: 8px 15px;
    background: #ef4444;
    color: white;
    border-radius: 8px;
    text-decoration: none;
}

.logout-btn:hover {
    background: #dc2626;
}
</style>

<div class="profile-container">

    <div class="profile-card">

        <!-- IMAGE -->
        {% if user.image %}
            <img src="{{ url_for('static', filename=user.image) }}" class="profile-img">
        {% else %}
            <img src="{{ url_for('static', filename='profile.jpeg') }}" class="profile-img">
        {% endif %}

        <!-- NAME FIXED -->
        <h2>{{ user.name }}</h2>

        <p><b>Email:</b> {{ user.email }}</p>
        <p><b>DOB:</b> {{ user.dob }}</p>
        <p><b>Gender:</b> {{ user.gender }}</p>

        <a href="/logout" class="logout-btn">Logout</a>

    </div>

</div>

{% endblock %}
