<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Patient System</title>
  <link rel="stylesheet" href="/static/login.css">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  <style>
    .flash-message { 
      padding: 10px; 
      border-radius: 5px; 
      margin-bottom: 15px; 
      text-align: center;
    }
    .flash-success { background-color: #d4edda; color: #155724; }
    .flash-danger { background-color: #f8d7da; color: #721c24; }
  </style>
</head>
<body>
  <div class="wrapper">

    <!-- Flash Messages -->
    

    <form method="POST" action="{{ url_for('login') }}">
      <h1>Login</h1>
      <div class="input-box">
        <input type="text" name="email" placeholder="Email" required>
        <i class='bx bxs-user'></i>
      </div>
      <div class="input-box">
        <input type="password" name="password" placeholder="Password" required>
        <i class='bx bxs-lock-alt'></i>
      </div>
      <div class="remember-forgot">
        <label><input type="checkbox"> Remember Me</label>
        <a href="{{ url_for('forgot') }}">Forgot Password</a>
      </div>
      <button type="submit" class="btn">Login</button>

      <div class="register-link">
        <p>Don't have an account? <a href="{{ url_for('register') }}">Register</a></p>
      </div>
       {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash-message {% if category=='success' %}flash-success{% else %}flash-danger{% endif %}">
            {{ message }}
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <script>
      setTimeout(() => {
        const msgs = document.querySelectorAll('.flash-message');
        msgs.forEach(msg => msg.style.display = 'none');
      }, 3000); // hide after 4 seconds
    </script>

    </form>
  </div>
</body>
</html>
