<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin History Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body{
  min-height:100vh;
  background:
    linear-gradient(rgba(12, 24, 49, 0.85),rgba(10,20,40,.85)),
    url("{{ url_for('static', filename='AI-powered glaucoma risk screening system.png') }}")
    no-repeat center center fixed;
  background-size:cover;
  color:#fff;
}
    /* ===== Header ===== */
    .header{
      padding:25px 40px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      background:rgba(255,255,255,0.05);
      backdrop-filter:blur(10px);
      border-bottom:1px solid rgba(255,255,255,0.1);
    }

    .header h1{
      margin:0;
      font-size:26px;
      font-weight:700;
    }

    .back-btn{
      text-decoration:none;
      color:white;
      padding:10px 18px;
      border-radius:8px;
      background:linear-gradient(135deg,#2563eb,#1e40af);
      font-weight:600;
      transition:.3s;
    }

    .back-btn:hover{
      transform:translateY(-2px);
    }

    /* ===== Grid Cards ===== */
    .container{
    min-height: calc(100vh - 120px); /* full height minus header */
    display: flex;
    justify-content: center;   /* horizontal center */
    align-items: center;       /* vertical center */
}

.grid{
    display: grid;
    grid-template-columns: repeat(4, 250px); /* fixed width cards */
    gap: 80px;
}


    .card{
      background:linear-gradient(135deg,#1e3a8a,#2563eb);
      border-radius:22px;
      padding:35px 25px;
      text-align:center;
      box-shadow:0 20px 45px rgba(0,0,0,0.45);
      transition:0.35s;
      text-decoration:none;
      color:white;
    }

    .card:hover{
      transform:translateY(-8px) scale(1.04);
      box-shadow:0 25px 60px rgba(0,0,0,0.6);
    }

    .icon{
      font-size:42px;
      margin-bottom:15px;
    }

    .card h3{
      margin:10px 0 8px;
      font-size:20px;
      font-weight:700;
    }

    .card p{
      margin:0;
      font-size:14px;
      opacity:0.9;
    }

    /* ===== Footer ===== */
    .footer{
      text-align:center;
      padding:20px;
      font-size:13px;
      opacity:0.6;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <div class="header">
    <h1>📊 Admin History</h1>
    <a href="{{ url_for('admin_dashboard') }}" class="back-btn">⬅ Dashboard</a>
  </div>

  <!-- CONTENT -->
  <div class="container">
    <div class="grid">

      <a href="{{ url_for('admin_users') }}" class="card">
        <div class="icon">👤</div>
        <h3>Registered Users</h3>
        <p>View all registered users</p>
      </a>

      <a href="{{ url_for('admin_logins') }}" class="card">
        <div class="icon">🔐</div>
        <h3>Login Logs</h3>
        <p>User login & logout history</p>
      </a>

      <a href="{{ url_for('admin_results') }}" class="card">
        <div class="icon">📈</div>
        <h3>Screening Results</h3>
        <p>Scan & upload results</p>
      </a>

      <a href="{{ url_for('admin_contacts') }}" class="card">
        <div class="icon">📩</div>
        <h3>Contact Messages</h3>
        <p>User messages & queries</p>
      </a>

    </div>
  </div>

  <!-- FOOTER -->
  <div class="footer">
    © 2026 Glaucoma Screening System • Admin Panel
  </div>

</body>
</html>
