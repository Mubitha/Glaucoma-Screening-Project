<!DOCTYPE html>
<html>
<head>
<title>{{ category }} Results</title>

<style>

body{
font-family:Arial;
background:#f4f6f9;
}

h2{
text-align:center;
margin-top:30px;
}

.back-btn{
display:block;
width:120px;
margin:20px auto;
text-align:center;
padding:8px;
background:#2c3e50;
color:white;
text-decoration:none;
border-radius:6px;
}

table{
width:90%;
margin:30px auto;
border-collapse:collapse;
background:white;
}

th,td{
padding:10px;
border:1px solid #ddd;
text-align:center;
}

th{
background:#2c3e50;
color:white;
}

</style>
</head>

<body>

<h2>{{ category }} Screening Results</h2>

<a href="{{ url_for('admin_results') }}"></a>

<table>

<tr>
<th>ID</th>
<th>User</th>
<th>Category</th>
<th>CDR</th>
<th>Image Type</th>
<th>Date</th>
</tr>

{% for row in rows %}

<tr>
<td>{{ row.id }}</td>
<td>{{ row.full_name }}</td>
<td>{{ row.Category }}</td>
<td>{{ row.cdr_value }}</td>
<td>{{ row.image_type }}</td>
<td>{{ row.result_date }}</td>
</tr>

{% endfor %}

</table>

</body>
</html>
