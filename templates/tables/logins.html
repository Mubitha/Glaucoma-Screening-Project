<!DOCTYPE html>
<html>
<head>
    <title>Login users</title>
    <style>
        body { font-family: Arial; background:#f4f6f9; }
        table {
            width: 90%;
            margin: 40px auto;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }
        th {
            background: #2c3e50;
            color: white;
        }
        tr:hover {
            background: #f1f1f1;
        }
        h2 {
            text-align:center;
            margin-top:30px;
        }
    </style>
</head>
<body>

<h2>Login users list</h2>
<div style="
width:250px;
margin:15px auto;
background:#2563eb;
color:white;
padding:10px;
border-radius:8px;
text-align:center;
font-size:18px;
">
Total Login Users : {{ total_logins }}
</div>


<table>
    <tr>
        <th>ID</th>
        <th>User ID</th>
        <th>Login Time</th>
        <th>Logout Time</th>
        <th>Status</th>
    </tr>

    {% for row in rows %}
    <tr>
        <td>{{ row.id }}</td>
        <td>{{ row.user_id }}</td>
        <td>{{ row.login_time }}</td>
        <td>{{ row.logout_time or "Still Active" }}</td>
        <td>{{ row.status }}</td>
    </tr>
    {% endfor %}

</table>

</body>
</html>
