<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glaucoma Treatments</title>
    

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 0;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            background-color: #35393c;
            color: white;
        }

        header h1 {
            margin: 0;
            font-size: 2.2em;
        }

        /* Container for all treatment cards */
        .treatments-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); /* bigger cards */
            gap: 25px;
            padding: 20px;
            max-width: 1100px;
            margin: auto;
        }

        .treatment-card {
            position: relative;
            cursor: pointer;
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s;
            background-color: white;
        }

        .treatment-card:hover {
            transform: translateY(-5px);
        }

        .treatment-card img {
            width: 100%;
            height: 250px; /* increased image size */
            object-fit: cover;
            border-bottom: 3px solid #c9cdd7; /* optional decorative line */
        }

        .treatment-card h2 {
            margin: 12px;
            color: #333;
            font-size: 1.25em;
            text-align: center;
        }

        /* Modal Styles */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(6px);
            background-color: rgba(0,0,0,0.5);
            z-index: 100;
        }

        .modal-content {
            background-color: white;
            border-radius: 12px;
            padding: 20px 25px;
            width: 90%;
            max-width: 500px;
            max-height: 80%;
            overflow-y: auto;
            text-align: left;
            position: relative;
            animation: fadeIn 0.3s ease;
        }

        .modal-content h2 {
            margin-top: 0;
            text-align: center;
        }

        .modal-content ul {
            padding-left: 20px;
        }

        .modal-content ul li {
            margin-bottom: 8px;
            font-size: 0.95em;
            line-height: 1.4;
        }

        .close-btn {
            position: absolute;
            top: 12px;
            right: 15px;
            font-size: 1.5em;
            font-weight: bold;
            color: #888;
            cursor: pointer;
        }

        .close-btn:hover {
            color: #333;
        }

        @keyframes fadeIn {
            from {opacity: 0; transform: scale(0.9);}
            to {opacity: 1; transform: scale(1);}
        }

        /* Responsive tweak for very small screens */
        @media (max-width: 700px) {
            .treatments-container {
                grid-template-columns: 1fr; /* 1 card per row on small screens */
            }
        }
    </style>
</head>
<body>

<header>
    <h1>Glaucoma Treatments</h1>
</header>

<div class="treatments-container">
    <div class="treatment-card" data-title="Medicine Treatment (Eye Drops)" data-points='["First-line treatment for glaucoma","Helps reduce intraocular pressure (IOP)","Must be used daily and regularly","Does not cure glaucoma but controls progression","Examples: Latanoprost, Timolol, Brimonidine"]'>
        <img src="/static/glaucoma-drops-1-800x423.jpg" alt="Eye Drops">
        <h2>Medicine Treatment (Eye Drops)</h2>
    </div>

    <div class="treatment-card" data-title="Tablet Treatment (Oral Medication)" data-points='["Used when eye drops are not sufficient","Reduces eye fluid production","Usually prescribed for short-term use","May cause side effects, requires doctor monitoring","Example: Acetazolamide"]'>
        <img src="/static/images.jfif" alt="Tablet Treatment">
        <h2>Tablet Treatment (Oral Medication)</h2>
    </div>

    <div class="treatment-card" data-title="Laser Treatment" data-points='["Improves fluid drainage from the eye","Helps lower eye pressure","Performed as outpatient procedure","Painless and quick","Common types: Laser Trabeculoplasty, Laser Iridotomy"]'>
        <img src="/static/edc0e7c5cf0300e8d2a8218ac990a155987a3089.webp" alt="Laser Treatment">
        <h2>Laser Treatment</h2>
    </div>

    <div class="treatment-card" data-title="Surgery Treatment" data-points='["Recommended when other treatments fail","Creates a new drainage pathway for eye fluid","Effective for advanced glaucoma","Requires post-surgery follow-up care","Types: Trabeculectomy, Tube Surgery, MIGS"]'>
        <img src="/static/man_eye_surgery_547054646.jpg" alt="Surgery Treatment">
        <h2>Surgery Treatment</h2>
    </div>

    <div class="treatment-card" data-title="Lifestyle Management & Monitoring" data-points='["Supports medical treatment and controls pressure","Includes regular eye check-ups","Proper use of prescribed drops is essential","Avoid activities increasing eye pressure","Helps slow disease progression"]'>
        <img src="/static/ChatGPT Image Jan 28, 2026, 11_02_40 AM.png" alt="Lifestyle Management">
        <h2>Lifestyle Management & Monitoring</h2>
    </div>

    <div class="treatment-card" data-title="Combination Therapy" data-points='["Uses more than one treatment together","Common: eye drops + laser or surgery","Chosen when a single treatment is not enough","Provides better pressure control","Customized based on patient condition"]'>
        <img src="/static/ChatGPT Image Jan 28, 2026, 12_32_26 PM.png" alt="Combination Therapy">
        <h2>Combination Therapy</h2>
    </div>
</div>

<!-- Modal -->
<div class="modal" id="modal">
    <div class="modal-content">
        <span class="close-btn" id="closeBtn">&times;</span>
        <h2 id="modalTitle"></h2>
        <ul id="modalPoints"></ul>
    </div>
</div>

<script>
    const cards = document.querySelectorAll('.treatment-card');
    const modal = document.getElementById('modal');
    const modalTitle = document.getElementById('modalTitle');
    const modalPoints = document.getElementById('modalPoints');
    const closeBtn = document.getElementById('closeBtn');

    cards.forEach(card => {
        card.addEventListener('click', () => {
            const title = card.dataset.title;
            const points = JSON.parse(card.dataset.points);

            modalTitle.textContent = title;
            modalPoints.innerHTML = '';
            points.forEach(point => {
                const li = document.createElement('li');
                li.textContent = point;
                modalPoints.appendChild(li);
            });

            modal.style.display = 'flex';
        });
    });

    closeBtn.addEventListener('click', () => {
        modal.style.display = 'none';
    });

    window.addEventListener('click', (e) => {
        if(e.target === modal){
            modal.style.display = 'none';
        }
    });
</script>

</body>
</html>
