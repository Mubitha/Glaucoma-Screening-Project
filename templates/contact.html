<!DOCTYPE html>
<html>
<head>
    <title>Contact</title>
    <style>
       
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: url("{{ url_for('static', filename='AI-powered glaucoma risk screening system.png') }}");
    background-size: cover;
    background-position: center;
}

.overlay {
    width: 100%;
    height: 100vh;
    backdrop-filter: blur(8px);
    background: rgba(0, 0, 0, 0.35);
    display: flex;
    justify-content: center;
    align-items: center;
}

.card {
    width: 380px;
    padding: 35px;
    border-radius: 18px;
    background: rgba(255, 255, 255, 0.17);
    backdrop-filter: blur(20px);
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
    border: 1px solid rgba(255,255,255,0.2);
    text-align: center;
    color: white;
}

.card h2 {
    margin-bottom: 25px;
    font-weight: 600;
    letter-spacing: 1px;
}

input, textarea {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border-radius: 10px;
    border: none;
    outline: none;
    font-size: 14px;
    background: rgba(255,255,255,0.25);
    color: white;
    transition: 0.3s;
}

input::placeholder,
textarea::placeholder {
    color: #eee;
}

input:focus, textarea:focus {
    background: rgba(255,255,255,0.4);
    box-shadow: 0 0 10px rgba(255,255,255,0.4);
}

input[readonly] {
    opacity: 0.8;
}

button {
    width: 100%;
    padding: 12px;
    margin-top: 15px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(45deg, #00c6ff, #0072ff);
    color: white;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.4);
}

.success-card {
    width: 380px;
    padding: 35px;
    border-radius: 18px;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(20px);
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
    text-align: center;
    color: white;
}

.back-btn {
    display: inline-block;
    margin-top: 20px;
    padding: 10px 20px;
    border-radius: 10px;
    background: linear-gradient(45deg, #00c6ff, #0072ff);
    text-decoration: none;
    color: white;
    font-weight: 500;
    transition: 0.3s;
}

.back-btn:hover {
    transform: translateY(-2px);
}
</style>

</head>
<body>

<div class="overlay">

{% if success %}

<div class="success-card">
    <h3>✅ Message Sent Successfully!</h3>
    <p>We will get back to you soon.</p>
    <a href="/dashboard" class="back-btn">Back to Dashboard</a>
</div>

{% else %}

<div class="card">
    <h2>Contact Us</h2>
    <form method="POST">

    <input type="text" value="{{ user.full_name }}" readonly>

    <input type="email" value="{{ user.email }}" readonly>

    <textarea name="message" rows="4"
        placeholder="Enter your message" required></textarea>

    <button type="submit">Send Message</button>

</form>

</div>

{% endif %}

</div>

</body>
</html>
