<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password</title>
  <link rel="stylesheet" href="/static/forgot.css">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <style>
    .flash-message.success { background: #d4edda; color: #155724; padding: 10px; margin-bottom: 10px; border-radius: 5px; text-align:center; }
    .flash-message.danger { background: #f8d7da; color: #721c24; padding: 10px; margin-bottom: 10px; border-radius: 5px; text-align:center; }
  </style>
</head>
<body>

  <div class="wrapper">
    <form method="POST">
      <h1>Forgot Password</h1>
      <p class="info-text">
        Enter your registered email to reset your password
      </p>

      

      <div class="input-box">
        <input type="email" name="email" placeholder="Email Address" required>
        <i class='bx bxs-envelope'></i>
      </div>

      <button type="submit" class="btn">Send Reset Link</button>

      <div class="back-link">
        <p>Remember your password?  <a href="{{ url_for('login') }}">Login</a></p>
      </div>
    </form>
    <!-- Flash Messages -->
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="flash-message {{ category }}">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}
  </div>

  <script>
    // Hide flash messages after 5 seconds
    window.onload = function() {
      const flash = document.querySelectorAll('.flash-message');
      flash.forEach(msg => {
        setTimeout(() => {
          msg.style.opacity = '0';
          setTimeout(() => { msg.remove(); }, 500);
        }, 3000);
      });
    }
  </script>

</body>
</html>
