<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Analytics Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
    font-family: 'Segoe UI', sans-serif;

    background:
    linear-gradient(rgba(10,20,40,0.7), rgba(10,20,40,0.7)),
    url("{{ url_for('static', filename='AI-powered glaucoma risk screening system.png') }}")
    no-repeat center center fixed;

    background-size: cover;
    color:white;

    /* 🔥 CENTER ALIGN */
    display:flex;
    flex-direction:column;
    justify-content:center;
    min-height:100vh;
    padding:20px;
}

/* TITLE */
h1{
    text-align:center;
    margin-bottom:60px;
    margin-top:10px;   /* 👈 konjam kela */
}

/* GRID */
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:25px;
}

/* CARD */
.card{
    backdrop-filter: blur(15px);
    background: rgba(255,255,255,0.1);
    border:1px solid rgba(255,255,255,0.2);
    padding:20px;
    border-radius:18px;
    box-shadow:0 10px 25px rgba(0,0,0,0.4);
}

.card h3{
    margin-bottom:15px;
    color:#f1f5f9;
}

/* CANVAS */
canvas{
    height:250px !important;
}

#alertBox{
    display:none;
    position:fixed;
    top:20px;
    right:20px;
    background:red;
    color:white;
    padding:10px 20px;
    border-radius:8px;
}

/* FOOTER */
.footer{
    text-align:center;
    margin-top:80px;
    font-size:13px;
    opacity:0.7;
}



</style>
</head>

<body>
    <div id="alertBox">⚠️ HIGH risk increased!</div>


<h1>🧠 System Analytics Dashboard</h1>

<div class="grid">

<div class="card">
<h3>Total Risk</h3>
<canvas id="totalRiskChart"></canvas>
</div>

<div class="card">
<h3>Webcam Risk</h3>
<canvas id="webcamRiskChart"></canvas>
</div>

<div class="card">
<h3>Upload Risk</h3>
<canvas id="uploadRiskChart"></canvas>
</div>

<div class="card">
<h3>Usage (Webcam vs Upload)</h3>
<canvas id="usageChart"></canvas>
</div>

</div>

<div class="footer">
© 2026 Glaucoma Screening System • Admin Panel
</div>

<script>

let charts = {};
let previousHigh = 0;
let isLoading = false;

function createBar(id, labels, data){
    if(charts[id]) charts[id].destroy();

    charts[id] = new Chart(document.getElementById(id), {
        type:"bar",
        data:{
            labels:labels,
            datasets:[{
                data:data,
                backgroundColor: labels.map(l=>{
                    if(l==="LOW") return "green";
                    if(l==="MEDIUM") return "yellow";
                    if(l==="HIGH") return "red";
                    return "blue";
                })
            }]
        },
        options:{
            plugins:{legend:{display:false}},
            scales:{
                x:{ticks:{color:"#fff"}},
                y:{ticks:{color:"#fff"},beginAtZero:true}
            }
        }
    });
}

function loadAnalytics(){

    if(isLoading) return;
    isLoading = true;

    fetch("/admin/analytics-data")
    .then(res=>res.json())
    .then(data=>{

        createBar("totalRiskChart",
            data.totalRisk.map(x=>x.label),
            data.totalRisk.map(x=>x.value)
        );

        createBar("webcamRiskChart",
            data.webcamRisk.map(x=>x.label),
            data.webcamRisk.map(x=>x.value)
        );

        createBar("uploadRiskChart",
            data.uploadRisk.map(x=>x.label),
            data.uploadRisk.map(x=>x.value)
        );

        createBar("usageChart",
            data.usage.map(x=>x.label),
            data.usage.map(x=>x.value)
        );

        // 🔥 CHECK HIGH
        let currentHigh = 0;

        data.totalRisk.forEach(x=>{
            if(x.label==="HIGH") currentHigh = x.value;
        });

        // 🔔 ALERT + EMAIL
        if(currentHigh > previousHigh){

            document.getElementById("alertBox").style.display="block";

            setTimeout(()=>{
                document.getElementById("alertBox").style.display="none";
            },3000);

            fetch("/send-alert/" + currentHigh);
        }

        previousHigh = currentHigh;
        isLoading = false;
    });
}

// FIRST LOAD
loadAnalytics();

// AUTO REFRESH EVERY 5 SEC
setInterval(loadAnalytics, 5000);

</script>
</body>
</html>
